# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  # Timeout for analysis
  timeout: 5m

  # Exit code when at least one issue was found
  issues-exit-code: 1

  # Include test files
  tests: true

  # Which dirs to skip: issues from them won't be reported
  skip-dirs:
    - vendor
    - test/mocks
    - tools
    - deployments

  # Which files to skip: they will be analyzed, but issues from them won't be reported
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"

  # Allow multiple parallel golangci-lint instances running
  allow-parallel-runners: true

output:
  # Format: colored-line-number|line-number|json|tab|checkstyle|code-climate|junit-xml|github-actions
  format: colored-line-number

  # Print lines of code with issue
  print-issued-lines: true

  # Print linter name in the end of issue text
  print-linter-name: true

  # Make issues output unique by line
  uniq-by-line: true

  # Sort results by: filepath, line and column
  sort-results: true

linters:
  # Disable all linters
  disable-all: true

  # Enable specific linters
  enable:
    # Bugs and correctness
    - errcheck        # Check for unchecked errors
    - gosimple        # Simplify code
    - govet           # Reports suspicious constructs
    - ineffassign     # Detect ineffectual assignments
    - staticcheck     # Go static analysis
    - typecheck       # Type-check Go code
    - unused          # Check for unused constants, variables, functions and types

    # Style and formatting
    - gofmt           # Check whether code was gofmt-ed
    - goimports       # Check import statements are formatted
    - misspell        # Find commonly misspelled English words
    - revive          # Fast, configurable, extensible, flexible, and beautiful linter for Go

    # Complexity
    - gocyclo         # Compute cyclomatic complexity
    - gocognit        # Compute cognitive complexity
    - funlen          # Detect long functions

    # Performance
    - prealloc        # Find slice declarations that could potentially be pre-allocated

    # Security
    - gosec           # Inspect source code for security problems

    # Error handling
    - errname         # Check that sentinel errors are prefixed with Err
    - errorlint       # Find code that will cause problems with Go 1.13 error wrapping

    # Code quality
    - dupl            # Code clone detection
    - goconst         # Find repeated strings that could be replaced by a constant
    - gocritic        # Provides diagnostics that check for bugs, performance and style issues
    - godot           # Check if comments end in a period
    - goprintffuncname # Check that printf-like functions are named with f at the end
    - nolintlint      # Report ill-formed or insufficient nolint directives
    - whitespace      # Detection of leading and trailing whitespace

    # Maintainability
    - maintidx        # Measure maintainability index of each function

    # Best practices
    - contextcheck    # Check whether the function uses a non-inherited context
    - exhaustive      # Check exhaustiveness of enum switch statements
    - nilerr          # Find code that returns nil even if it checks that the error is not nil
    - nilnil          # Check that there is no simultaneous return of nil error and an invalid value
    - unconvert       # Remove unnecessary type conversions
    - unparam         # Report unused function parameters
    - wastedassign    # Find wasted assignment statements

linters-settings:
  errcheck:
    # Report about not checking of errors in type assertions: `a := b.(MyStruct)`
    check-type-assertions: true

    # Report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`
    check-blank: false

    # List of functions to exclude from checking
    exclude-functions:
      - (io.Closer).Close
      - (*database/sql.Rows).Close

  govet:
    # Enable all analyzers
    enable-all: true

    # Disable specific analyzers
    disable:
      - shadow  # Reports variables that shadow other variables

  gocyclo:
    # Minimal cyclomatic complexity to report
    min-complexity: 15

  gocognit:
    # Minimal cognitive complexity to report
    min-complexity: 20

  funlen:
    # Maximum number of lines in a function
    lines: 100

    # Maximum number of statements in a function
    statements: 50

  dupl:
    # Threshold for duplicate code detection
    threshold: 100

  goconst:
    # Minimum length of string constant
    min-len: 3

    # Minimum occurrences count to trigger
    min-occurrences: 3

  gocritic:
    # Enable multiple checks by tags
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated

    # Disable specific checks
    disabled-checks:
      - whyNoLint
      - unnamedResult

  misspell:
    # Locale to use
    locale: US

  revive:
    # Enable all rules
    enable-all-rules: false

    # Specific rules to enable
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  gosec:
    # Select which checks to run
    includes:
      - G101 # Look for hard coded credentials
      - G102 # Bind to all interfaces
      - G103 # Audit the use of unsafe block
      - G104 # Audit errors not checked
      - G106 # Audit the use of ssh.InsecureIgnoreHostKey
      - G107 # Url provided to HTTP request as taint input
      - G108 # Profiling endpoint automatically exposed on /debug/pprof
      - G109 # Potential Integer overflow made by strconv.Atoi result conversion to int16/32
      - G110 # Potential DoS vulnerability via decompression bomb
      - G201 # SQL query construction using format string
      - G202 # SQL query construction using string concatenation
      - G203 # Use of unescaped data in HTML templates
      - G204 # Audit use of command execution
      - G301 # Poor file permissions used when creating a directory
      - G302 # Poor file permissions used with chmod
      - G303 # Creating tempfile using a predictable path
      - G304 # File path provided as taint input
      - G305 # File traversal when extracting zip/tar archive
      - G306 # Poor file permissions used when writing to a new file
      - G307 # Deferring a method which returns an error
      - G401 # Detect the usage of DES, RC4, MD5 or SHA1
      - G402 # Look for bad TLS connection settings
      - G403 # Ensure minimum RSA key length of 2048 bits
      - G404 # Insecure random number source (rand)
      - G501 # Import blocklist: crypto/md5
      - G502 # Import blocklist: crypto/des
      - G503 # Import blocklist: crypto/rc4
      - G504 # Import blocklist: net/http/cgi
      - G505 # Import blocklist: crypto/sha1
      - G601 # Implicit memory aliasing of items from a range statement

  maintidx:
    # Maintainability index threshold
    under: 20

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0

  # Maximum count of issues with the same text
  max-same-issues: 0

  # Show only new issues
  new: false

  # Fix found issues (if it's supported by the linter)
  fix: false

  # Exclude specific issues
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen
        - gocognit

    # Exclude known linters from partially hard-vendored code
    - path: internal/hmac
      text: "weak cryptographic primitive"
      linters:
        - gosec

    # Exclude lll issues for long lines with go:generate
    - linters:
        - lll
      source: "^//go:generate "

    # Independently from option `exclude` we use default exclude patterns
    - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"
      linters:
        - errcheck

    # Exclude shadow checking on the variable named err
    - text: "shadow: declaration of \"err\""
      linters:
        - govet
