openapi: 3.0.3
info:
  title: Workflow Engine API
  description: |
    A robust backend API for managing and executing workflows using Directed Acyclic Graphs (DAGs). 
    Supports multiple node types including Webhook, HTTP Request, Conditional, Loop, Delay, Transform, 
    Parallel, OpenAI Completions, and Embeddings. Built with Golang, Gin, and integrated with Inngest 
    for durable executions. This API enables creation, scheduling, and monitoring of complex workflows 
    with concurrency via Goroutines.
    
    ## Key Features
    - Workflow CRUD operations
    - Synchronous and asynchronous execution
    - Webhook triggers and scheduling
    - Comprehensive logging and error handling
    - JWT-based authentication
    
    ## Authentication
    All endpoints under `/api/v1` require a valid JWT Bearer token in the `Authorization` header.
    Health check endpoint is public.
    
    ## Error Responses
    All errors return a standard JSON structure:
    ```
    {
      "error": {
        "code": "string",
        "message": "string",
        "details": "object"
      }
    }
    ```
    
    Common HTTP status codes:
    - 200 OK: Success
    - 201 Created: Resource created
    - 400 Bad Request: Validation error
    - 401 Unauthorized: Invalid token
    - 403 Forbidden: Insufficient permissions
    - 404 Not Found: Resource not found
    - 409 Conflict: Duplicate resource
    - 422 Unprocessable Entity: Business logic error
    - 500 Internal Server Error: Server issue
  version: 1.0.0
  contact:
    name: Workflow Engine Team
    email: support@workflowengine.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.workflowengine.example.com
    description: Production server
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Workflows
    description: Operations related to workflow definitions and management
  - name: Executions
    description: Monitoring and control of workflow executions
  - name: Schedules
    description: Managing scheduled workflow triggers
  - name: Webhooks
    description: Dynamic webhook registration and handling
  - name: Health
    description: System health and readiness checks
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health Check
      description: Returns the current status of the API server.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workflows:
    get:
      tags:
        - Workflows
      summary: List Workflows
      description: Retrieve a paginated list of workflows. Supports filtering by status, name, and tags.
      operationId: listWorkflows
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          description: Filter by workflow status (active, inactive, draft)
          required: false
          schema:
            type: string
            enum:
              - active
              - inactive
              - draft
        - name: name
          in: query
          description: Filter by workflow name (partial match)
          required: false
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response with paginated workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Workflows
      summary: Create Workflow
      description: Create a new workflow definition. The definition must be a valid JSON DAG structure.
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '400':
          description: Invalid request body or DAG structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Workflow name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workflows/{id}:
    get:
      tags:
        - Workflows
      summary: Get Workflow
      description: Retrieve details of a specific workflow by ID.
      operationId: getWorkflow
      parameters:
        - name: id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Workflows
      summary: Update Workflow
      description: Update an existing workflow. Increments the version and validates the new definition.
      operationId: updateWorkflow
      parameters:
        - name: id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workflow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '400':
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Workflows
      summary: Delete Workflow
      description: Delete a workflow and all associated executions (soft delete by default).
      operationId: deleteWorkflow
      parameters:
        - name: id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
            format: uuid
        - name: hardDelete
          in: query
          description: "If true, perform hard delete (default: false)"
          required: false
          schema:
            type: boolean
            default: false
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Workflow deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workflows/{id}/execute:
    post:
      tags:
        - Workflows
      summary: Execute Workflow
      description: Trigger a synchronous or asynchronous execution of a workflow. Supports input parameters.
      operationId: executeWorkflow
      parameters:
        - name: id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
            format: uuid
        - name: async
          in: query
          description: "If true, return immediately with execution ID (default: false)"
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteWorkflowRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Synchronous execution completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '202':
          description: Asynchronous execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '400':
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/executions/{id}:
    get:
      tags:
        - Executions
      summary: Get Execution
      description: Retrieve details of a specific workflow execution.
      operationId: getExecution
      parameters:
        - name: id
          in: path
          required: true
          description: Execution ID
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Executions
      summary: Cancel Execution
      description: Cancel a running execution. Only applicable for executions in 'running' state.
      operationId: cancelExecution
      parameters:
        - name: id
          in: path
          required: true
          description: Execution ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelExecutionRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Execution cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '400':
          description: Cannot cancel (not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/executions/{id}/logs:
    get:
      tags:
        - Executions
      summary: Get Execution Logs
      description: Retrieve logs for a specific execution. Supports pagination and filtering by node or level.
      operationId: getExecutionLogs
      parameters:
        - name: id
          in: path
          required: true
          description: Execution ID
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Logs per page
          required: false
          schema:
            type: integer
            default: 50
        - name: level
          in: query
          description: Filter by log level (info, warn, error)
          required: false
          schema:
            type: string
            enum:
              - info
              - warn
              - error
        - name: nodeId
          in: query
          description: Filter logs by node ID
          required: false
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of execution logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/schedules:
    get:
      tags:
        - Schedules
      summary: List Schedules
      description: Retrieve all scheduled workflows for the authenticated user.
      operationId: listSchedules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSchedulesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Schedules
      summary: Create Schedule
      description: Schedule a workflow to run on a cron pattern.
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          description: Invalid cron expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/schedules/{id}:
    get:
      tags:
        - Schedules
      summary: Get Schedule
      description: Retrieve details of a specific schedule.
      operationId: getSchedule
      parameters:
        - name: id
          in: path
          required: true
          description: Schedule ID
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Schedule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Schedules
      summary: Delete Schedule
      description: Remove a schedule.
      operationId: deleteSchedule
      parameters:
        - name: id
          in: path
          required: true
          description: Schedule ID
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Schedule deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/webhooks:
    post:
      tags:
        - Webhooks
      summary: Register Webhook
      description: Register a dynamic webhook endpoint for triggering workflows.
      operationId: registerWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWebhookRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Invalid webhook configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/webhooks/{id}:
    get:
      tags:
        - Webhooks
      summary: Get Webhook
      description: Retrieve webhook details.
      operationId: getWebhook
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook ID
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Webhooks
      summary: Unregister Webhook
      description: Remove a webhook registration.
      operationId: unregisterWebhook
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook ID
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Webhook unregistered
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Common
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Invalid workflow definition"
            details:
              type: object
              additionalProperties: true
      required:
        - error
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        pages:
          type: integer
          example: 5
      required:
        - page
        - limit
        - total
        - pages
    
    # Health
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        version:
          type: string
          example: "1.0.0"
        uptime:
          type: string
          example: "24h"
      required:
        - status
    
    # Workflow Schemas
    CreateWorkflowRequest:
      type: object
      properties:
        name:
          type: string
          example: "User Onboarding Workflow"
          minLength: 1
          maxLength: 255
        description:
          type: string
          example: "Automates user onboarding process"
        status:
          type: string
          enum:
            - draft
            - active
            - inactive
          default: "draft"
        definition:
          type: object
          description: DAG structure with nodes and edges
          additionalProperties: true
          example:
            nodes:
              - id: "start"
                type: "webhook"
                config: {}
              - id: "email"
                type: "email"
                config:
                  to: "{{input.email}}"
                from: "start"
            edges:
              - from: "start"
                to: "email"
        tags:
          type: array
          items:
            type: string
          example: ["onboarding", "automation"]
      required:
        - name
        - definition
    
    UpdateWorkflowRequest:
      type: object
      properties:
        name:
          type: string
          example: "Updated Workflow"
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - inactive
        definition:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
      required:
        - definition  # At least one field should be provided, but definition is key
    
    WorkflowResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "User Onboarding Workflow"
        description:
          type: string
        version:
          type: integer
          example: 1
        status:
          type: string
          enum:
            - draft
            - active
            - inactive
        definition:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          example: "user@example.com"
      required:
        - id
        - name
        - version
        - status
        - definition
        - createdAt
        - updatedAt
    
    ListWorkflowsResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - workflows
        - pagination
    
    # Execution Schemas
    ExecuteWorkflowRequest:
      type: object
      properties:
        input:
          type: object
          description: Input parameters for the workflow
          additionalProperties: true
          example:
            userId: 123
            email: "user@example.com"
        webhookSecret:
          type: string
          description: Secret for webhook validation (if applicable)
          writeOnly: true
      required:
        - input
    
    ExecutionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174001"
        workflowId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
          example: "completed"
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          description: Final output from the workflow
          additionalProperties: true
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeExecution'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        duration:
          type: integer
          description: Execution duration in milliseconds
          example: 1500
        error:
          $ref: '#/components/schemas/ErrorDetails'
      required:
        - id
        - workflowId
        - status
        - startedAt
    
    NodeExecution:
      type: object
      properties:
        id:
          type: string
          example: "node-1"
        type:
          type: string
          enum:
            - webhook
            - http_request
            - conditional
            - loop
            - openai_completion
            - openai_embedding
            - delay
            - transform
            - parallel
            - email
            - database
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        duration:
          type: integer
          example: 200
        error:
          $ref: '#/components/schemas/ErrorDetails'
      required:
        - id
        - type
        - status
    
    ErrorDetails:
      type: object
      properties:
        code:
          type: string
          example: "NODE_ERROR"
        message:
          type: string
          example: "HTTP request failed"
        stack:
          type: string
      required:
        - code
        - message
    
    CancelExecutionRequest:
      type: object
      properties:
        reason:
          type: string
          example: "Manual cancellation due to invalid input"
      required:
        - reason
    
    ListLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - logs
        - pagination
    
    LogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
        nodeId:
          type: string
        level:
          type: string
          enum:
            - info
            - warn
            - error
          example: "info"
        message:
          type: string
          example: "Node started execution"
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
      required:
        - id
        - executionId
        - level
        - message
        - timestamp
    
    # Schedule Schemas
    CreateScheduleRequest:
      type: object
      properties:
        workflowId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        cron:
          type: string
          description: Cron expression (e.g., "0 0 * * *")
          example: "0 9 * * 1-5"  # Every weekday at 9 AM
        input:
          type: object
          additionalProperties: true
          description: Fixed input for scheduled executions
        timezone:
          type: string
          default: "UTC"
          example: "Asia/Ho_Chi_Minh"
        enabled:
          type: boolean
          default: true
      required:
        - workflowId
        - cron
    
    ScheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        cron:
          type: string
        input:
          type: object
          additionalProperties: true
        timezone:
          type: string
        enabled:
          type: boolean
        nextRunAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - workflowId
        - cron
        - enabled
        - createdAt
    
    ListSchedulesResponse:
      type: object
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleResponse'
      required:
        - schedules
    
    # Webhook Schemas
    RegisterWebhookRequest:
      type: object
      properties:
        workflowId:
          type: string
          format: uuid
        path:
          type: string
          description: Custom path for the webhook (auto-generated if empty)
          example: "/webhook/user-signup"
        secret:
          type: string
          description: Secret for signature validation
          writeOnly: true
          format: password
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - DELETE
          default: "POST"
        inputMapping:
          type: object
          description: Map incoming payload to workflow input
          additionalProperties: true
          example:
            userEmail: "request.body.email"
      required:
        - workflowId
    
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          example: "https://api.example.com/webhooks/abc123"
        path:
          type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - DELETE
        secret:
          type: string
          format: password
          readOnly: true
        inputMapping:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - workflowId
        - url
        - method
        - createdAt
